[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-context-tier-allocator"
version = "0.1.0"
description = "Allocates LLM context window token budgets across rules, pinned memory, RAG chunks, and history via priority knapsack"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-context-tier-allocator = "prompt_context_tier_allocator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_context_tier_allocator*"]
